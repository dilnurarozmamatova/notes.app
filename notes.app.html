<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes App</title>

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  text-align: center;
  padding: 20px;
}

  
.container {
  max-width: 500px;
  margin: auto;
}

textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  font-size: 16px;
}

button {
  padding: 10px 15px;
  margin-top: 10px;
  cursor: pointer;
}

.note {
  background: white;
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
}
</style>

</head>
<body>

<div class="container">
  <h2>📝 Notes App</h2>

  <textarea id="noteInput" placeholder="Write a note..."></textarea>
  <br>
  <button onclick="addNote()">Add Note</button>

  <div id="notesList"></div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function renderNotes() {
  let list = document.getElementById("notesList");
  list.innerHTML = "";

  notes.forEach((note, index) => {
    list.innerHTML += `
      <div class="note">
        <span>${note}</span>
        <button onclick="deleteNote(${index})">X</button>
      </div>
    `;
  });
}

function addNote() {
  let input = document.getElementById("noteInput");
  let text = input.value;

  if (text.trim() === "") return;

  notes.push(text);
  localStorage.setItem("notes", JSON.stringify(notes));

  input.value = "";
  renderNotes();
}

function deleteNote(index) {
  notes.splice(index, 1);
  localStorage.setItem("notes", JSON.stringify(notes));
  renderNotes();
}

renderNotes();
</script>

</body>
</html>
